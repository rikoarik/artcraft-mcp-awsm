name: Browser E2E (manual)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/tools/browser-*.ts"
      - "src/tools/visual-png.ts"
      - "src/tools/review-ui.ts"
      - "test/browser-e2e.mjs"
      - ".github/workflows/browser-e2e.yml"
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install optional browser test dependency
        run: npm install --no-save playwright@1.55.0
      - name: Provision Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node test/browser-e2e.mjs
